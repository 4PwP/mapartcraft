server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Include default mime types
    include /etc/nginx/mime.types;
    
    # Ensure custom worker extension is handled
    types {
        application/javascript jsworker;
    }

    # Redirect root to /mapartcraft/
    location = / {
        return 301 /mapartcraft/;
    }

    # Handle the application path
    location /mapartcraft/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /mapartcraft/index.html;
    }
    
    # Catch-all for assets if they are requested with the prefix
    location ~ ^/mapartcraft/(static|images)/(.*) {
        alias /usr/share/nginx/html/$1/$2;
    }

    # Static assets caching
    location ~* \.(?:css|js|jsworker|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}